<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Google Sans',Arial,sans-serif}
  :root{
    --p1-1:#22d3ee; --p2-1:#a855f7;
    --text:#f3f6fb; --text-muted:#a3b0c7; --text-faint:#7c8aa3;
    --glass:rgba(255,255,255,0.035); --glass-border:rgba(255,255,255,0.10);
    --hot:#f2867a; --cold:#38bdf8; --return:#f2b84f; --green:#34d399;
  }
  body{background:#05070c;color:var(--text);min-height:100vh}
  .main{padding:10px 16px;display:flex;flex-direction:column;gap:10px}

  .topbar{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .topbar-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
  .topbar-sub{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);margin-top:2px}
  .now-pill{background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:20px;padding:5px 14px;font-size:10.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;white-space:nowrap}
  .now-pill .ndot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}

  .filterbar{background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fchip{background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
  .fchip input{background:none;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;width:120px}
  .fchip.toggle{gap:2px;padding:3px}
  .tg-btn{padding:4px 11px;border-radius:6px;font-size:10.5px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--text-muted);cursor:pointer;user-select:none}
  .tg-btn.active{color:#0a0612;background:linear-gradient(120deg,var(--p1-1),var(--p2-1))}

  .callout{display:none;align-items:center;gap:10px;background:rgba(242,134,122,.08);border:1px solid rgba(242,134,122,.3);border-radius:10px;padding:9px 14px}
  .callout.show{display:flex}
  .callout .ic{width:22px;height:22px;border-radius:6px;background:rgba(242,134,122,.18);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .callout .tx{font-size:11.5px;color:var(--text)}
  .callout .tx b{color:var(--hot)}
  .callout .dismiss{margin-left:auto;font-size:14px;color:var(--text-faint);cursor:pointer;padding:2px 6px;user-select:none}

  .kpi-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .kpi-tile{background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:10px 12px;transition:border-color .15s}
  .kpi-tile.filterable{cursor:pointer}
  .kpi-tile.filterable:hover{border-color:rgba(255,255,255,.25)}
  .kpi-tile.active-filter{border-color:var(--p1-1);background:rgba(34,211,238,.06)}
  .kpi-tile .lbl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:8.5px;text-transform:uppercase;color:var(--text-faint)}
  .kpi-tile .val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:#fff;margin-top:4px}
  .kpi-tile .val .unit{font-size:10px;color:var(--text-faint);margin-left:3px;font-weight:500}

  .legend-row{display:flex;align-items:center;gap:16px;background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:7px 14px;flex-wrap:wrap}
  .legend-row .t{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px}
  .heat-scale{flex:1;display:flex;align-items:center;gap:8px;min-width:120px}
  .heat-bar{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#1a2f28,var(--green),var(--return),var(--hot))}
  .heat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-faint)}

  .wing-block{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:16px}
  .wing-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .wing-hd .t{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px}
  .wing-hd .m{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint)}

  /* ผังย่อ — พิกัดจริงจากผังอาคาร (ตาม HALL_LAYOUT) ย่อสัดส่วนลง ไม่ใช่ขนาดเต็มเหมือนเดิม */
  .mini-map{position:relative;margin-bottom:18px}
  .mini-blk{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:10px;cursor:pointer;transition:opacity .15s}
  .mini-blk.dim{opacity:.2;pointer-events:none}
  .mini-blk.heat-1{background:rgba(242,134,122,.14);color:var(--hot)}
  .mini-blk.heat-2{background:rgba(242,184,79,.11);color:var(--return)}
  .mini-blk.heat-3{background:rgba(52,211,153,.10);color:var(--green)}
  .mini-blk.heat-0{background:rgba(255,255,255,.025);color:#444441}

  /* กลุ่มรายการฮอล — row-card แทนตาราง/การ์ดใหญ่เดิม */
  .grp-hd{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}
  .grp-hd + .hall-list{margin-bottom:22px}
  .grp-hd .t{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px}
  .grp-hd .m{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-faint)}
  .hall-list{display:flex;flex-direction:column;gap:6px}
  .hall-row{display:flex;align-items:center;gap:14px;border-radius:10px;padding:11px 14px;cursor:pointer}
  .hall-row.dim{display:none}
  .hall-row .accent{width:6px;height:34px;border-radius:3px;flex-shrink:0}
  .hall-row .info{width:64px;flex-shrink:0}
  .hall-row .nm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--text)}
  .hall-row .sub{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--text-faint);margin-top:1px}
  .hall-row .mid{flex:1;min-width:0}
  .hall-row .mid-ev{font-size:10.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hall-row .mid-none{font-size:10px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hall-row .row-spark{display:flex;align-items:flex-end;gap:2px;height:20px;flex-shrink:0}
  .hall-row .row-spark-bar{width:5px;border-radius:1px;background:currentColor;opacity:.35}
  .hall-row .row-spark-bar.today{opacity:1}
  .hall-row .kw{width:68px;text-align:right;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px}
  .hall-row .kw .u{font-size:8.5px;font-weight:500;color:var(--text-faint);margin-left:2px}
  .hall-row.heat-1{background:rgba(242,134,122,.06);color:var(--hot)}.hall-row.heat-1 .accent{background:var(--hot)}
  .hall-row.heat-2{background:rgba(242,184,79,.05);color:var(--return)}.hall-row.heat-2 .accent{background:var(--return)}
  .hall-row.heat-3{background:rgba(52,211,153,.045);color:var(--green)}.hall-row.heat-3 .accent{background:var(--green)}
  .hall-row.heat-0{background:rgba(255,255,255,.015);color:var(--text-faint)}.hall-row.heat-0 .accent{background:#2c2c2a}

  .loading-note{color:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:11px;padding:20px;text-align:center}
</style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title">Exhibition Hall Monitor</div>
      <div class="topbar-sub" id="topbarSub">Exhibition Wing</div>
    </div>
    <div class="now-pill"><div class="ndot"></div><span id="updTime">—</span></div>
  </div>

  <div class="filterbar">
    <div class="fchip">🔍<input id="searchInput" placeholder="ค้นหา hall เช่น EH101"></div>
    <div class="fchip toggle" id="dateToggle">
      <span class="tg-btn active" data-days="0">วันนี้</span>
      <span class="tg-btn" data-days="1">เมื่อวาน</span>
    </div>
  </div>

  <div class="callout" id="callout">
    <div class="ic">⚡</div>
    <div class="tx" id="calloutText"></div>
    <div class="dismiss" id="calloutDismiss">✕</div>
  </div>

  <div class="kpi-tiles">
    <div class="kpi-tile"><div class="lbl">Total AHU</div><div class="val">58<span class="unit">หน่วย</span></div></div>
    <div class="kpi-tile filterable" id="tilePh1" data-phase="p1"><div class="lbl">Phase 1</div><div class="val">36<span class="unit">หน่วย</span></div></div>
    <div class="kpi-tile filterable" id="tilePh2" data-phase="p2"><div class="lbl">Phase 2</div><div class="val">22<span class="unit">หน่วย</span></div></div>
    <div class="kpi-tile"><div class="lbl">kWh/m² เฉลี่ย</div><div class="val" id="kpiAvgIntensity">—</div></div>
    <div class="kpi-tile"><div class="lbl">Event วันนี้</div><div class="val" id="kpiEventCount" style="color:var(--return)">—</div></div>
  </div>

  <div class="legend-row">
    <span class="t">kWh/m² percentile</span>
    <div class="heat-scale"><span class="heat-lbl">ต่ำสุด</span><div class="heat-bar"></div><span class="heat-lbl">สูงสุด</span></div>
  </div>

  <div class="wing-block">
    <div class="wing-hd"><span class="t">Exhibition Wing (EH)</span><span class="m" id="dateLabel"></span></div>
    <div class="mini-map" id="miniMap">
      <div class="loading-note">กำลังโหลดข้อมูล...</div>
    </div>
    <div id="hallGroups">
      <div class="loading-note">กำลังโหลดข้อมูล...</div>
    </div>
  </div>
</div>

<script>
// [สำคัญ] URL deploy จริง — เอาค่าเดียวกับไฟล์อื่นทุกไฟล์ในระบบ (index.html/ac.html/monthly.html)
var API_URL = "https://script.google.com/macros/s/AKfycbzMKaY7odRqUEu5CBZoTbnekcLBoVlG0NWjW-GqnrcizQPeSFjJYDU6ebV-MZRZi9tJTw/exec";

// พิกัด/สัดส่วนจากผังจริงที่ Brew ส่งมา — เอามาจาก ahu.html เดิมตรงๆ ไม่แก้พิกัดเลย
var HALL_LAYOUT = [
  { label: 'EH104',        left: 0,   top: 29,  width: 154, height: 367, phase: 'p1' },
  { label: 'EH103',        left: 181, top: 35,  width: 157, height: 357, phase: 'p1' },
  { label: 'EH102',        left: 374, top: 35,  width: 154, height: 357, phase: 'p1' },
  { label: 'EH101',        left: 548, top: 35,  width: 158, height: 357, phase: 'p1' },
  { label: 'EH99',         left: 802, top: 38,  width: 154, height: 354, phase: 'p2' },
  { label: 'EH98',         left: 989, top: 38,  width: 157, height: 354, phase: 'p2' },
  { label: 'SAMA-GARDEN',  left: 0,   top: 421, width: 154, height: 364, phase: 'p1' },
  { label: 'BEAT',         left: 181, top: 421, width: 157, height: 360, phase: 'p1' },
  { label: 'LIVE',         left: 374, top: 421, width: 154, height: 360, phase: 'p2' },
  { label: 'EH100',        left: 802, top: 415, width: 154, height: 355, phase: 'p2' }
];
var PHASE_LABELS = {
  p1: HALL_LAYOUT.filter(function(h){ return h.phase === 'p1'; }).map(function(h){ return h.label; }),
  p2: HALL_LAYOUT.filter(function(h){ return h.phase === 'p2'; }).map(function(h){ return h.label; })
};

var state = { dateDays: 0, phaseFilter: null, search: '', dataByLabel: {}, sparkByHall: {}, lastSeenByHall: {} };
var MINI_Y_SCALE = 0.18; // ย่อสัดส่วนแนวตั้งของผังย่อ (แนวนอนใช้ % ของ container แทน ยืดหดตามจอได้)
function miniLabel_(label) {
  if (label.indexOf('EH') === 0) return label.slice(2);
  if (label === 'SAMA-GARDEN') return 'SAMA';
  return label;
}

function fmtNum_(v, digits) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return Number(v).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function fmtDateThai_(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  var days = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  var months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return 'วัน' + days[d.getDay()] + 'ที่ ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function dateStrOf_(daysAgo) {
  var d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// [ใหม่] คำนวณ percentile bucket (heat-1/2/3) จริงจาก kWh/m² ของฮอลที่มีข้อมูลวันนี้เท่านั้น
// heat-0 = ไม่มี event วันนี้ (ไม่มีค่าให้จัดอันดับ)
function computeHeatClasses_(dataByLabel) {
  var vals = [];
  HALL_LAYOUT.forEach(function(h) {
    var d = dataByLabel[h.label];
    if (d && d.hasEventToday && typeof d.kwhPerSqm === 'number') vals.push(d.kwhPerSqm);
  });
  vals.sort(function(a, b) { return a - b; });
  var t1 = vals.length ? vals[Math.floor(vals.length / 3)] : null;
  var t2 = vals.length ? vals[Math.floor(vals.length * 2 / 3)] : null;
  var cls = {};
  HALL_LAYOUT.forEach(function(h) {
    var d = dataByLabel[h.label];
    if (!d || !d.hasEventToday || typeof d.kwhPerSqm !== 'number') { cls[h.label] = 'heat-0'; return; }
    if (t2 !== null && d.kwhPerSqm >= t2) cls[h.label] = 'heat-1';
    else if (t1 !== null && d.kwhPerSqm >= t1) cls[h.label] = 'heat-2';
    else cls[h.label] = 'heat-3';
  });
  return cls;
}

// [ใหม่] เทรนด์วันนี้เทียบเมื่อวาน จาก sparkline จริง — ใช้ทั้งเป็น badge บนกล่อง และหา "ตัวขยับแรงสุด"
function trendPct_(series) {
  if (!series || series.length < 2) return null;
  var today = series[series.length - 1].kwh, yday = series[series.length - 2].kwh;
  if (!(yday > 0)) return null;
  return Math.round(((today - yday) / yday) * 100);
}
function sparkBarsHtml_(series, cls) {
  if (!series || !series.length) return '';
  var vals = series.map(function(s) { return s.kwh; });
  var max = Math.max.apply(null, vals.concat([0.0001]));
  var bars = vals.map(function(v, i) {
    var h = Math.max(3, Math.round((v / max) * 100));
    return '<div class="' + cls + '-bar' + (i === vals.length - 1 ? ' today' : '') + '" style="height:' + h + '%"></div>';
  }).join('');
  return bars;
}

function computeCallout_(dataByLabel, sparkByHall) {
  var best = null;
  HALL_LAYOUT.forEach(function(h) {
    var d = dataByLabel[h.label];
    if (!d || !d.hasEventToday) return;
    var pct = trendPct_(sparkByHall[h.label]);
    if (pct === null) return;
    if (!best || Math.abs(pct) > Math.abs(best.pct)) best = { label: h.label, pct: pct, eventName: d.eventName };
  });
  var el = document.getElementById('callout');
  if (!best || Math.abs(best.pct) < 20) { el.classList.remove('show'); return; }
  var dir = best.pct > 0 ? 'พุ่ง' : 'ลดลง';
  document.getElementById('calloutText').innerHTML =
    '<b>' + best.label + ' ' + dir + ' ' + Math.abs(best.pct) + '%</b> จากเมื่อวาน' + (best.eventName ? ' — ' + best.eventName : '');
  el.classList.add('show');
}

function computeKpis_(dataByLabel) {
  var vals = [], evCount = 0;
  HALL_LAYOUT.forEach(function(h) {
    var d = dataByLabel[h.label];
    if (d && d.hasEventToday) {
      evCount++;
      if (typeof d.kwhPerSqm === 'number') vals.push(d.kwhPerSqm);
    }
  });
  document.getElementById('kpiEventCount').textContent = evCount + ' hall';
  document.getElementById('kpiAvgIntensity').textContent = vals.length
    ? fmtNum_(vals.reduce(function(a, b) { return a + b; }, 0) / vals.length, 3) : '—';
}

// [ใหม่] ผังย่อ — จุดประสงค์แค่ให้เห็นตำแหน่ง/สถานะสีคร่าวๆ ไม่ใช่การ์ดข้อมูลเต็ม
// (รายละเอียดทั้งหมดย้ายไปอยู่ในลิสต์ด้านล่างแทน) แนวนอนใช้ % ของ container (ยืดหดตามจอ)
// แนวตั้งคูณด้วย MINI_Y_SCALE คงที่ กันผังสูงเทอะทะเหมือนเดิม
function renderMiniMap() {
  var canvas = document.getElementById('miniMap');
  var heatCls = computeHeatClasses_(state.dataByLabel);
  var maxRight = HALL_LAYOUT.reduce(function(m, h) { return Math.max(m, h.left + h.width); }, 0);
  var maxBottom = HALL_LAYOUT.reduce(function(m, h) { return Math.max(m, h.top + h.height); }, 0);
  canvas.style.height = Math.round(maxBottom * MINI_Y_SCALE + 8) + 'px';

  var html = HALL_LAYOUT.map(function(pos) {
    var leftPct = (pos.left / maxRight * 100).toFixed(2);
    var widthPct = (pos.width / maxRight * 100).toFixed(2);
    var top = Math.round(pos.top * MINI_Y_SCALE);
    var height = Math.round(pos.height * MINI_Y_SCALE);

    var d = state.dataByLabel[pos.label];
    var searchable = (pos.label + ' ' + (d && d.eventName ? d.eventName : '')).toLowerCase();
    var matchesSearch = !state.search || searchable.indexOf(state.search) > -1;
    var matchesPhase = !state.phaseFilter || state.phaseFilter === pos.phase;
    var dimCls = (matchesSearch && matchesPhase) ? '' : ' dim';

    return '<div class="mini-blk ' + heatCls[pos.label] + dimCls + '" data-label="' + pos.label + '" title="' + pos.label + '" style="left:' + leftPct + '%;top:' + top + 'px;width:' + widthPct + '%;height:' + height + 'px">' + miniLabel_(pos.label) + '</div>';
  }).join('');
  canvas.innerHTML = html;
}

// [ใหม่] แถวรายละเอียดของฮอลเดียว — ใช้ร่วมกันทั้ง Phase 1/2 (โครงสร้างเดียวกันทุกฮอล
// ไม่ว่าจะมี event หรือไม่ ต่างกันแค่เนื้อหาใน .sub/.mid/.spark ตามที่ confirm ไว้)
function hallRowHtml_(label, heatCls) {
  var pos = HALL_LAYOUT.filter(function(h) { return h.label === label; })[0];
  var d = state.dataByLabel[label];
  var last = state.lastSeenByHall[label];
  var kwhHtml = (d && d.kwh !== null) ? fmtNum_(d.kwh, 0) : '0';

  var subHtml, midHtml, sparkHtml;
  if (d && d.hasEventToday) {
    subHtml = 'TR/m² ' + (d.trPerSqm !== null ? fmtNum_(d.trPerSqm, 3) : '—');
    midHtml = '<div class="mid-ev">' + (d.eventName || '—') + '</div>';
    var series = state.sparkByHall[label];
    sparkHtml = series ? '<div class="row-spark" style="color:currentColor">' + sparkBarsHtml_(series, 'row-spark') + '</div>' : '<div class="row-spark"></div>';
  } else {
    subHtml = (d && d.areaSqm !== null) ? fmtNum_(d.areaSqm, 0) + ' m²' : '—';
    midHtml = '<div class="mid-none">🌙 ' + (last && last.daysAgo !== null ? 'ล่าสุด ' + last.daysAgo + ' วันก่อน' : 'ยังไม่เคยมี event') + '</div>';
    sparkHtml = '';
  }

  var searchable = (label + ' ' + (d && d.eventName ? d.eventName : '')).toLowerCase();
  var matchesSearch = !state.search || searchable.indexOf(state.search) > -1;
  var matchesPhase = !state.phaseFilter || state.phaseFilter === pos.phase;
  var dimCls = (matchesSearch && matchesPhase) ? '' : ' dim';

  return '<div class="hall-row ' + heatCls[label] + dimCls + '" data-label="' + label + '" id="row-' + label + '">'
    + '<div class="accent"></div>'
    + '<div class="info"><div class="nm">' + label + '</div><div class="sub">' + subHtml + '</div></div>'
    + '<div class="mid">' + midHtml + '</div>'
    + sparkHtml
    + '<div class="kw">' + kwhHtml + '<span class="u">kWh</span></div>'
    + '</div>';
}

function renderHallGroups() {
  var body = document.getElementById('hallGroups');
  var heatCls = computeHeatClasses_(state.dataByLabel);
  function groupHtml(labels, title) {
    return '<div class="grp-hd"><span class="t">' + title + '</span><span class="m">' + labels.length + ' halls</span></div>'
      + '<div class="hall-list">' + labels.map(function(l) { return hallRowHtml_(l, heatCls); }).join('') + '</div>';
  }
  body.innerHTML = groupHtml(PHASE_LABELS.p1, 'Event Halls · Phase 1') + groupHtml(PHASE_LABELS.p2, 'Event Halls · Phase 2');
}

function renderAll_() {
  renderMiniMap();
  renderHallGroups();
}

function loadEventHalls(dateStr) {
  document.getElementById('miniMap').innerHTML = '<div class="loading-note">กำลังโหลดข้อมูล...</div>';
  document.getElementById('hallGroups').innerHTML = '<div class="loading-note">กำลังโหลดข้อมูล...</div>';

  var mainUrl = API_URL + '?action=eventhalls' + (dateStr ? ('&date=' + dateStr) : '');
  fetch(mainUrl)
    .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status + ' (eventhalls)'); return res.json(); })
    .then(function(mainRes) {
      if (mainRes && mainRes.error) throw new Error(mainRes.error);
      var resolvedDate = mainRes.date;
      document.getElementById('dateLabel').textContent = '· ' + fmtDateThai_(resolvedDate);
      document.getElementById('topbarSub').textContent = 'Exhibition Wing · ' + fmtDateThai_(resolvedDate);
      document.getElementById('updTime').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      state.dataByLabel = {};
      (mainRes.halls || []).forEach(function(item) { state.dataByLabel[item.label] = item; });
      computeKpis_(state.dataByLabel);

      var sparkUrl = API_URL + '?action=eventhallsparkline&date=' + resolvedDate + '&days=7';
      var lastSeenUrl = API_URL + '?action=eventhallslastseen&date=' + resolvedDate;
      return Promise.all([
        fetch(sparkUrl).then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status + ' (sparkline)'); return res.json(); }),
        fetch(lastSeenUrl).then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status + ' (lastseen)'); return res.json(); })
      ]).then(function(results) {
        var sparkRes = results[0], lastSeenRes = results[1];
        if (sparkRes && sparkRes.error) throw new Error(sparkRes.error);
        if (lastSeenRes && lastSeenRes.error) throw new Error(lastSeenRes.error);
        state.sparkByHall = (sparkRes && sparkRes.byHall) ? sparkRes.byHall : {};
        state.lastSeenByHall = (lastSeenRes && lastSeenRes.byHall) ? lastSeenRes.byHall : {};
        renderAll_();
        computeCallout_(state.dataByLabel, state.sparkByHall);
      });
    })
    .catch(function(err) {
      var msg = '<div class="loading-note" style="color:var(--hot)">โหลดข้อมูลไม่สำเร็จ: ' + err.message + '</div>';
      document.getElementById('miniMap').innerHTML = msg;
      document.getElementById('hallGroups').innerHTML = msg;
    });
}

// ── event wiring ──────────────────────────────────────────────
// [ใหม่] คลิกบล็อกในผังย่อ -> เลื่อนไปแถวของฮอลนั้นในลิสต์ด้านล่าง + ไฮไลต์ชั่วครู่
document.getElementById('miniMap').addEventListener('click', function(e) {
  var blk = e.target.closest('.mini-blk');
  if (!blk) return;
  var row = document.getElementById('row-' + blk.dataset.label);
  if (!row) return;
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.style.boxShadow = '0 0 0 2px rgba(255,255,255,.3)';
  setTimeout(function() { row.style.boxShadow = ''; }, 900);
});

document.getElementById('dateToggle').addEventListener('click', function(e) {
  var btn = e.target.closest('.tg-btn');
  if (!btn) return;
  document.querySelectorAll('#dateToggle .tg-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  state.dateDays = Number(btn.dataset.days);
  loadEventHalls(dateStrOf_(state.dateDays));
});

function togglePhaseFilter_(phase, tileId) {
  var tile = document.getElementById(tileId);
  if (state.phaseFilter === phase) {
    state.phaseFilter = null;
    tile.classList.remove('active-filter');
  } else {
    document.getElementById('tilePh1').classList.remove('active-filter');
    document.getElementById('tilePh2').classList.remove('active-filter');
    state.phaseFilter = phase;
    tile.classList.add('active-filter');
  }
  renderAll_();
}
document.getElementById('tilePh1').addEventListener('click', function() { togglePhaseFilter_('p1', 'tilePh1'); });
document.getElementById('tilePh2').addEventListener('click', function() { togglePhaseFilter_('p2', 'tilePh2'); });

document.getElementById('searchInput').addEventListener('input', function(e) {
  state.search = e.target.value.trim().toLowerCase();
  renderAll_();
});

document.getElementById('calloutDismiss').addEventListener('click', function() {
  document.getElementById('callout').classList.remove('show');
});

// [เหมือนเดิม] ไม่ hardcode วันที่ ปล่อยให้ backend resolve "วันล่าสุดที่มีข้อมูลจริง" เอง
// รับประกันตรงกับ Location Zone panel เสมอ (logic เดียวกับที่ ahu.html เดิมทำไว้)
loadEventHalls(null);
</script>
